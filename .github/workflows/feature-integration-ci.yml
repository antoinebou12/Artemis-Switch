name: Feature and Integration CI

on:
  push:
    branches:
      - main
      - agent/artemis-switch-integration
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: artemis-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-integration:
    name: Consolidated portable integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate localization JSON syntax
        run: |
          python -m json.tool resources/i18n/en-US/main.json > /dev/null
          python -m json.tool resources/i18n/fr/main.json > /dev/null

      - name: Validate Artemis English/French translation coverage
        run: python tests/i18n_consistency_test.py

      - name: Validate release/CD contract
        run: python tests/release_contract_test.py

      - name: Validate isolated VPN build contract
        run: python tests/vpn_build_contract_test.py

      - name: Configure unit suite
        run: cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build unit suite
        run: cmake --build build/tests --parallel

      - name: Run unit suite
        run: ctest --test-dir build/tests --output-on-failure

      - name: Configure cross-feature integration suite
        run: cmake -S ci/integration -B build/integration -DCMAKE_BUILD_TYPE=Debug

      - name: Build cross-feature integration suite
        run: cmake --build build/integration --parallel

      - name: Run cross-feature integration suite
        run: ctest --test-dir build/integration --output-on-failure

  release-package-contract:
    name: Release source package contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dry-run source packages
        shell: bash
        run: |
          chmod +x scripts/package-release-source.sh
          scripts/package-release-source.sh v0.0.0-ci "$RUNNER_TEMP/artemis-release"

      - name: Inspect source packages
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/artemis-release/Artemis-Switch-0.0.0-ci-source.tar.gz"
          zipfile="$RUNNER_TEMP/artemis-release/Artemis-Switch-0.0.0-ci-source.zip"
          test -s "$tarball"
          test -s "$zipfile"
          tar -tzf "$tarball" | grep -q 'Artemis-Switch-0.0.0-ci/README.md$'
          tar -tzf "$tarball" | grep -q 'Artemis-Switch-0.0.0-ci/SOURCE_INFO.txt$'
          tar -tzf "$tarball" | grep -q 'Artemis-Switch-0.0.0-ci/extern/wg-nx/include/wireguard.h$'
          tar -tzf "$tarball" | grep -q 'Artemis-Switch-0.0.0-ci/extern/netbird-switch/include/netbird.h$'
          unzip -l "$zipfile" | grep -q 'Artemis-Switch-0.0.0-ci/README.md'
          unzip -l "$zipfile" | grep -q 'Artemis-Switch-0.0.0-ci/SOURCE_INFO.txt'

  sanitizer-integration:
    name: ASan + UBSan integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests -B build/tests-sanitized -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/tests-sanitized --parallel

      - name: Test
        run: ctest --test-dir build/tests-sanitized --output-on-failure

  ci-summary:
    name: Artemis CI summary
    if: always()
    needs:
      - portable-integration
      - release-package-contract
      - sanitizer-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require all integration jobs
        run: |
          test "${{ needs.portable-integration.result }}" = "success"
          test "${{ needs.release-package-contract.result }}" = "success"
          test "${{ needs.sanitizer-integration.result }}" = "success"
