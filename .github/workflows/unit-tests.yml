name: Unit tests

on:
  # agent/** and feature/** pushes were the bulk of the August 8 run burst.
  # Topic branches are covered by pull_request; pushing to one no longer starts
  # a second, duplicate run.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: artemis-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules used by the portable tests
        # The unit suite compiles sources from extern/wg-nx and includes from
        # extern/borealis; a plain checkout leaves both empty. Shallow and
        # limited to what the tests need (a recursive checkout also pulls vcpkg).
        # act already runs against the local working copy.
        if: ${{ !env.ACT }}
        run: git submodule update --init --depth 1 extern/wg-nx extern/borealis

      - name: Validate Artemis English/French translations
        run: python tests/i18n_consistency_test.py

      - name: Validate release/CD contract
        run: python tests/release_contract_test.py

      - name: Configure
        run: cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/tests --parallel

      - name: Test
        run: ctest --test-dir build/tests --output-on-failure

  portable-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules used by the portable tests
        # The unit suite compiles sources from extern/wg-nx and includes from
        # extern/borealis; a plain checkout leaves both empty. Shallow and
        # limited to what the tests need (a recursive checkout also pulls vcpkg).
        # act already runs against the local working copy.
        if: ${{ !env.ACT }}
        run: git submodule update --init --depth 1 extern/wg-nx extern/borealis

      - name: Configure sanitizer build
        run: cmake -S tests -B build/tests-sanitized -DCMAKE_BUILD_TYPE=Debug

      - name: Build with sanitizers
        run: cmake --build build/tests-sanitized --parallel

      - name: Test with sanitizers
        run: ctest --test-dir build/tests-sanitized --output-on-failure
