name: Release Artemis Switch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artemis-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Release quality gate
    uses: ./.github/workflows/feature-integration-ci.yml

  switch-build:
    name: Build Nintendo Switch release
    needs: quality-gate
    uses: ./.github/workflows/docker-image.yml

  source-package:
    name: Package release source
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build source archives
        shell: bash
        run: |
          chmod +x scripts/package-release-source.sh
          scripts/package-release-source.sh "${{ steps.version.outputs.version }}" dist

      - name: Validate source archives
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          safe_version="${version#v}"
          tarball="dist/Artemis-Switch-${safe_version}-source.tar.gz"
          zipfile="dist/Artemis-Switch-${safe_version}-source.zip"
          test -s "$tarball"
          test -s "$zipfile"
          tar -tzf "$tarball" | grep -q "/README.md$"
          tar -tzf "$tarball" | grep -q "/SOURCE_INFO.txt$"
          unzip -l "$zipfile" | grep -q 'README.md'
          unzip -l "$zipfile" | grep -q 'SOURCE_INFO.txt'

      - name: Upload source packages
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-Switch-source
          path: dist/Artemis-Switch-*-source.*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality-gate
      - switch-build
      - source-package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Nintendo Switch NRO
        uses: actions/download-artifact@v4
        with:
          name: Artemis-Switch-nro
          path: dist

      - name: Download Nintendo Switch ELF
        uses: actions/download-artifact@v4
        with:
          name: Artemis-Switch-elf
          path: dist

      - name: Download source packages
        uses: actions/download-artifact@v4
        with:
          name: Artemis-Switch-source
          path: dist

      - name: Validate assets and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          test -s dist/Artemis-Switch.nro
          test -s dist/Artemis-Switch.elf
          test -s "dist/Artemis-Switch-${version}-source.tar.gz"
          test -s "dist/Artemis-Switch-${version}-source.zip"

          sha256sum \
            dist/Artemis-Switch.nro \
            dist/Artemis-Switch.elf \
            "dist/Artemis-Switch-${version}-source.tar.gz" \
            "dist/Artemis-Switch-${version}-source.zip" \
            > dist/SHA256SUMS.txt

          cat dist/SHA256SUMS.txt

      - name: Publish or refresh GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          elif [[ "$tag" == *-* ]]; then
            gh release create "$tag" dist/* \
              --verify-tag \
              --title "Artemis Switch $tag" \
              --generate-notes \
              --prerelease
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --title "Artemis Switch $tag" \
              --generate-notes
          fi
