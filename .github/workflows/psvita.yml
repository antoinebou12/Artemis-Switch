name: PS Vita VPK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psvita-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: PS Vita
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Build VPK
      shell: bash
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/src/" \
          xfangfang/wiliwili_psv_builder@sha256:4aa44270a69c15075b981a5d640b2adc0409131ef0e200bd7295dadc2dca48ae '
            set -euo pipefail

            git config --global --add safe.directory /src

            # The builder provides Vita hardware-decoding FFmpeg, PVR-enabled
            # SDL2, mbedTLS curl, and the PVR GLES2 SDK. Install the additional
            # libraries linked directly by Moonlight. Jansson 2.15 forces PIC
            # for its static library, which emits relocations unsupported by
            # vita-elf-create, so build it separately with PIC disabled.
            vdpm openssl expat opus zstd lame

            jansson_version="2.15.0"
            jansson_sha256="070a629590723228dc3b744ae90e965a569efb9c535b3309b52e80e75d8eb3be"
            jansson_dir="/tmp/moonlight-jansson"
            jansson_archive="$jansson_dir/jansson.tar.gz"

            mkdir -p "$jansson_dir"
            curl --fail --location --silent --show-error \
              "https://github.com/akheron/jansson/releases/download/v${jansson_version}/jansson-${jansson_version}.tar.gz" \
              --output "$jansson_archive"
            printf "%s  %s\n" "$jansson_sha256" "$jansson_archive" \
              | sha256sum -c -
            tar -xzf "$jansson_archive" -C "$jansson_dir"

            jansson_source="$jansson_dir/jansson-${jansson_version}"
            sed -i \
              "s/POSITION_INDEPENDENT_CODE true/POSITION_INDEPENDENT_CODE false/" \
              "$jansson_source/CMakeLists.txt"
            grep -Fq "POSITION_INDEPENDENT_CODE false" \
              "$jansson_source/CMakeLists.txt"

            cmake -S "$jansson_source" -B "$jansson_dir/build" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
              -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi" \
              -DCMAKE_BUILD_TYPE=Release \
              -DJANSSON_BUILD_DOCS=OFF \
              -DJANSSON_EXAMPLES=OFF \
              -DJANSSON_WITHOUT_TESTS=ON
            cmake --build "$jansson_dir/build" --parallel "$(nproc)"
            cmake --install "$jansson_dir/build"

            arm-vita-eabi-readelf -rW \
              "$VITASDK/arm-vita-eabi/lib/libjansson.a" \
              > "$jansson_dir/relocations.txt"
            if grep -Eq "R_ARM_(BASE_PREL|GOTPC|GOT_BREL)" \
              "$jansson_dir/relocations.txt"; then
              grep -E "R_ARM_(BASE_PREL|GOTPC|GOT_BREL)" \
                "$jansson_dir/relocations.txt"
              echo "Jansson contains relocations unsupported by vita-elf-create" >&2
              exit 1
            fi

            mkdir -p /src/extern/borealis/psv/module
            cp "$VITASDK/arm-vita-eabi/suprx/libpvrPSP2_WSEGL.suprx" \
              /src/extern/borealis/psv/module/

            cmake -S /src -B /src/build/psvita -G Ninja \
              -DPLATFORM_PSV=ON \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /src/build/psvita \
              --target Moonlight \
              --parallel "$(nproc)"

            arm-vita-eabi-readelf -rW /src/build/psvita/Moonlight \
              > "$jansson_dir/moonlight-relocations.txt"
            if grep -Eq "R_ARM_(BASE_PREL|GOTPC|GOT_BREL)" \
              "$jansson_dir/moonlight-relocations.txt"; then
              grep -E "R_ARM_(BASE_PREL|GOTPC|GOT_BREL)" \
                "$jansson_dir/moonlight-relocations.txt"
              echo "Moonlight contains relocations unsupported by vita-elf-create" >&2
              exit 1
            fi

            cmake --build /src/build/psvita \
              --target Moonlight.vpk \
              --parallel "$(nproc)"

            test -f /src/build/psvita/Moonlight.vpk
          '

    - name: Stage VPK
      id: vpk
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version="$GITHUB_REF_NAME"
        else
          version="${GITHUB_SHA:0:7}"
        fi

        filename="Moonlight-PSVita-${version}.vpk"
        mkdir -p dist
        cp build/psvita/Moonlight.vpk "dist/${filename}"
        echo "filename=${filename}" >> "$GITHUB_OUTPUT"

    - name: Upload VPK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-PSVita-VPK
        path: dist/${{ steps.vpk.outputs.filename }}
        if-no-files-found: error
