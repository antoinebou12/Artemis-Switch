name: All Builds

on:
  # This workflow fans out to six reusable cross-platform builds, so every
  # trigger is expensive and it is kept off the routine path.
  #
  # Pull requests are the gate: branches are validated before they land. There
  # is deliberately no push trigger for main -- PRs are rebase-merged, so the
  # exact commits have already been built here and a main build would only
  # repeat that work.
  #
  # Release tags do build the full matrix. release.yml covers the shipping
  # Switch NRO only, so this is where the other platforms get verified before
  # a version goes out.
  pull_request:
    branches: [ main ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:

# Supersede in-flight runs for the same PR instead of letting a burst of
# updates queue a full matrix each. Tag builds are never cancelled: a release
# must finish.
concurrency:
  group: artemis-all-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  switch:
    name: Nintendo Switch
    uses: ./.github/workflows/docker-image.yml

  psvita:
    name: PS Vita
    uses: ./.github/workflows/psvita.yml

  android:
    name: Android
    uses: ./.github/workflows/android-apk.yml
    secrets: inherit

  macos:
    name: macOS
    uses: ./.github/workflows/macos.yml

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml

  linux:
    name: Linux
    uses: ./.github/workflows/linux.yml
