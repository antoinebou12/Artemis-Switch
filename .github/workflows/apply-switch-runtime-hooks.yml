name: Apply Switch Runtime Hooks

on:
  push:
    branches:
      - agent/artemis-switch-integration
    paths:
      - ci/APPLY_SWITCH_RUNTIME_HOOKS
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Patch existing Switch runtime paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Artemis integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/artemis-switch-integration
          fetch-depth: 0

      - name: Apply targeted deko3D and InputManager hooks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ci/APPLY_SWITCH_RUNTIME_HOOKS ]]; then
            echo "Marker already consumed; nothing to apply."
            exit 0
          fi
          python3 scripts/ci/apply-switch-runtime-hooks.py
          rm ci/APPLY_SWITCH_RUNTIME_HOOKS
          git diff --check

      - name: Run portable Artemis tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests -B build/artemis-runtime-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/artemis-runtime-tests --parallel 2
          ctest --test-dir build/artemis-runtime-tests --output-on-failure

      - name: Commit runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Artemis-Switch CI"
          git config user.email "artemis-switch-ci@users.noreply.github.com"
          git add app/src/streaming/video/deko3d/DKVideoRenderer.cpp \
                  app/src/streaming/InputManager.cpp \
                  ci/APPLY_SWITCH_RUNTIME_HOOKS
          if git diff --cached --quiet; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git commit -m "feat: wire Artemis settings into Switch deko3D and motion input"
          git push origin HEAD:agent/artemis-switch-integration
