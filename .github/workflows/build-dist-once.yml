name: Build Artemis Switch NRO into dist (one-shot)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-dist-once.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: docker://devkitpro/devkita64:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Nintendo Switch NRO and capture diagnostics
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/artemis-switch-build.log) 2>&1

          rm -rf ./resources/font
          dkp-pacman --noconfirm -R switch-enet || true

          # These default to ON for Switch. CI states them explicitly because CI
          # is the release contract for what ships in the NRO.
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON             -DENABLE_WIREGUARD=ON -DENABLE_NETBIRD=ON -DARTEMIS_ALLOW_VPN_STUB=OFF"

          cmake -B build/switch $CMAKE_ARGS || true
          cmake -B build/switch $CMAKE_ARGS
          configure_rc=$?

          build_rc=$configure_rc
          if [ "$configure_rc" -eq 0 ]; then
            cmake --build build/switch --target Moonlight.nro --parallel 8
            build_rc=$?
          fi

          # A build that links the validate-only stub would still produce a
          # working-looking NRO that cannot tunnel a single packet. Fail here
          # instead of shipping it.
          if [ "$build_rc" -eq 0 ] && [ -s build/switch/Moonlight.elf ]; then
            echo "== Verifying real VPN backend symbols =="
            NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
            missing=0
            for sym in netbird_init netbird_poll netbird_shutdown                        netbird_proxy_start netbird_proxy_start_udp                        netbird_get_peer netbird_is_ready                        wg_nx_tunnel_create wg_nx_tunnel_start wg_init wg_connect; do
              if $NM build/switch/Moonlight.elf | grep -qE " [TtWw] $sym$"; then
                echo "  ok      $sym"
              else
                echo "  MISSING $sym"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "ERROR: real VPN backend symbols missing from Moonlight.elf"
              build_rc=1
            fi
          fi

          if [ "$build_rc" -eq 0 ] && [ -s build/switch/Moonlight.nro ]; then
            cp build/switch/Moonlight.nro /tmp/Artemis-Switch.nro
          fi

          printf '%s\n' "$build_rc" > /tmp/artemis-switch-build.rc
          exit 0

      - name: Publish NRO or failure log to main
        shell: bash
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rc="$(cat /tmp/artemis-switch-build.rc)"
          git reset --hard HEAD
          git pull --rebase origin main

          mkdir -p dist
          if [ "$rc" = "0" ] && [ -s /tmp/Artemis-Switch.nro ]; then
            cp /tmp/Artemis-Switch.nro dist/Artemis-Switch.nro
            rm -f dist/Artemis-Switch-build.log dist/Artemis-Switch-build-status.txt
            message="build: add Artemis Switch NRO to dist [skip ci]"
          else
            cp /tmp/artemis-switch-build.log dist/Artemis-Switch-build.log
            printf 'Nintendo Switch build failed with exit code %s\n' "$rc" > dist/Artemis-Switch-build-status.txt
            message="ci: record failed Artemis Switch build [skip ci]"
          fi

          git rm .github/workflows/build-dist-once.yml
          git add -f dist/Artemis-Switch.nro dist/Artemis-Switch-build.log dist/Artemis-Switch-build-status.txt 2>/dev/null || true
          git commit -m "$message"

          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
