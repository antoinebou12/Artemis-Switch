name: Build Artemis Switch NRO into dist (one-shot)

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-dist-once.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    container:
      image: docker://devkitpro/devkita64:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Remove bundled fonts
        run: rm -rf ./resources/font

      - name: Remove conflicting enet package
        run: dkp-pacman --noconfirm -R switch-enet

      - name: Configure (compatibility pass)
        continue-on-error: true
        run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON

      - name: Configure
        run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON

      - name: Build Nintendo Switch NRO
        run: cmake --build build/switch --target Moonlight.nro --parallel 8

      - name: Commit NRO into dist and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s build/switch/Moonlight.nro
          cp build/switch/Moonlight.nro /tmp/Artemis-Switch.nro

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Restore files modified only for the container build, then replay this
          # one-shot run on top of the newest master before publishing the binary.
          git reset --hard HEAD
          git pull --rebase origin master

          mkdir -p dist
          cp /tmp/Artemis-Switch.nro dist/Artemis-Switch.nro
          git add -f dist/Artemis-Switch.nro
          git rm .github/workflows/build-dist-once.yml
          git commit -m "build: add Artemis Switch NRO to dist [skip ci]"

          git push origin HEAD:master || {
            git pull --rebase origin master
            git push origin HEAD:master
          }
