name: Build Artemis Switch

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove bundled fonts
        run: rm -rf ./resources/font

      - name: Remove conflicting enet package
        run: |
          if dkp-pacman -Q switch-enet >/dev/null 2>&1; then
            dkp-pacman --noconfirm -R switch-enet
          fi

      # Keep the upstream two-pass configure behavior until the Switch build
      # has been fully cleaned up. The second pass remains the required one.
      - name: Configure (compatibility pass)
        continue-on-error: true
        run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON

      - name: Configure
        run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON

      - name: Build Nintendo Switch NRO
        run: cmake --build build/switch --target Moonlight.nro --parallel 8

      - name: Prepare Artemis artifacts
        run: |
          set -eu
          test -s build/switch/Moonlight.nro
          test -s build/switch/Moonlight.elf
          cp build/switch/Moonlight.nro build/switch/Artemis-Switch.nro
          cp build/switch/Moonlight.elf build/switch/Artemis-Switch.elf

      - name: Upload Artemis-Switch.nro
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-Switch-nro
          path: build/switch/Artemis-Switch.nro
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artemis-Switch.elf
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-Switch-elf
          path: build/switch/Artemis-Switch.elf
          if-no-files-found: error
          retention-days: 14
