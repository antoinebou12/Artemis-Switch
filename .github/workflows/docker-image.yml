name: Build artemi-switch

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: docker://devkitpro/devkita64:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove bundled fonts
        run: rm -rf ./resources/font

      - name: Remove conflicting enet package
        run: dkp-pacman --noconfirm -R switch-enet

      - name: Configure (compatibility pass)
        continue-on-error: true
        run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON

      - name: Configure
        run: cmake -B build/switch -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON -DUSE_DEKO3D=ON

      - name: Build Nintendo Switch NRO
        run: cmake --build build/switch --target Moonlight.nro --parallel 8

      - name: Prepare artemi-switch artifacts
        run: |
          set -euo pipefail
          test -s build/switch/Moonlight.nro
          test -s build/switch/Moonlight.elf
          cp build/switch/Moonlight.nro build/switch/artemi-switch.nro
          cp build/switch/Moonlight.elf build/switch/artemi-switch.elf

      - name: Upload artemi-switch NRO
        uses: actions/upload-artifact@v4
        with:
          name: artemi-switch-nro
          path: build/switch/artemi-switch.nro
          if-no-files-found: error
          retention-days: 14

      - name: Upload artemi-switch ELF
        uses: actions/upload-artifact@v4
        with:
          name: artemi-switch-elf
          path: build/switch/artemi-switch.elf
          if-no-files-found: error
          retention-days: 14
